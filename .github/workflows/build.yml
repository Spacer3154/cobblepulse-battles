name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Discover versions & APIs
        run: |
          mkdir -p out
          if [ -f ci/SKIP_DISCOVER ]; then echo skip; else python3 ci/discover.py out/discover > out/discover.log 2>&1 || true; fi

      - name: Build
        id: build
        run: |
          mkdir -p out
          set +e
          ./gradlew build --stacktrace --no-daemon > out/build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          grep -E "error:|warning: \[removal\]|FAILURE|What went wrong" -A3 out/build.log > out/build-errors.txt || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          # Nom historique : les CI de CobblePulse Utils et Battlepass telechargent encore cobblepulse-battletower-1.0.0.jar
          for j in out/cobblepulse-battles-*.jar; do case "$j" in *sources*) ;; *) cp "$j" out/cobblepulse-battletower-1.0.0.jar ;; esac; done
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: out
          retention-days: 3

      - name: Publish build outputs (build failed or quick mode)
        if: steps.build.outputs.status != '0' || hashFiles('ci/QUICK') != ''
        run: |
          cd out
          echo "sha=${GITHUB_SHA} build=${{ steps.build.outputs.status }} run=${GITHUB_RUN_ID}" > STATUS
          git init -q -b ci-output
          git config user.name "battles-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI output ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output

  smoke:
    needs: build
    if: needs.build.outputs.status == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: battletower
          MYSQL_DATABASE: cobblepulse
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pbattletower"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: build-out
          path: out

      - name: Server smoke test
        if: hashFiles('ci/smoke.py') != '' && hashFiles('ci/QUICK') == ''
        timeout-minutes: 75
        env:
          BT_MYSQL: '1'
        run: python3 ci/smoke.py out || true

      - name: Client screenshots
        if: hashFiles('ci/client.py') != '' && hashFiles('ci/SKIPCLIENT') == '' && hashFiles('ci/QUICK') == ''
        timeout-minutes: 30
        run: python3 ci/client.py out || true

      - name: Publish CI outputs to branch ci-output
        if: always()
        run: |
          cd out
          echo "sha=${GITHUB_SHA} build=0 run=${GITHUB_RUN_ID}" > STATUS
          git init -q -b ci-output
          git config user.name "battles-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI output ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output

  multiserver:
    needs: build
    if: needs.build.outputs.status == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: battletower
          MYSQL_DATABASE: cobblepulse
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pbattletower"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: build-out
          path: out

      - name: Multi-server test (lobby + combat, Redis, MySQL)
        if: hashFiles('ci/multi.py') != '' && hashFiles('ci/QUICK') == '' && hashFiles('ci/SKIPMULTI') == ''
        timeout-minutes: 30
        run: python3 ci/multi.py out-multi out/discover out || true

      - name: Publish to branch ci-output-multi
        if: always()
        run: |
          mkdir -p out-multi
          cd out-multi
          echo "sha=${GITHUB_SHA} run=${GITHUB_RUN_ID}" > STATUS
          git init -q -b ci-output-multi
          git config user.name "battles-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI multi output ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output-multi
