# ═══════════════════════════════════════════════════════════════════════
#  Ranked : missions quotidiennes et hebdomadaires
#  declencheur : victoire, partie, serie (série de victoires atteinte), ko (Pokémon adverses mis K.O.)
#  type : amical, classe ou tous (matchs comptés). format : "" (tous), "simple" ou "double".
#  chance : poids du tirage (sur 100). Commandes : %player%, %uuid%.
# ═══════════════════════════════════════════════════════════════════════

actif = true
nombre_quotidiennes = 3
nombre_hebdomadaires = 2
heure_reset = "00:00"
jour_reset_hebdo = "MONDAY"
# true = récompense donnée dès la mission terminée ; false = à réclamer dans le menu
reclamation_auto = false
annoncer = false

[[quotidienne]]
id = "gagner_1"
titre = "&aGagner un match"
description = "Gagnez 1 match (classé ou amical)."
declencheur = "victoire"
type = "tous"
format = ""
requis = 1
chance = 100
icone = "minecraft:diamond"
commandes = ["give %player% minecraft:diamond 1"]

