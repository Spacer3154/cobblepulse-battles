# "showdown" : formule et K dynamique de Pokémon Showdown (recommandé)
# "personnalise" : K fixé par les paliers ci-dessous
systeme = "showdown"
elo_depart = 1000
elo_plancher = 1000
# Gain positif maximal par jour et par format (les pertes ne sont jamais plafonnées). 0 = illimité.
gain_max_par_jour = 200

[personnalise]
parties_debutant = 30
k_debutant = 50
bonus_serie = false
bonus_serie_3 = 3
bonus_serie_5 = 5

[[personnalise.palier]]
elo_max = 1500
k = 48

[[personnalise.palier]]
elo_max = 1700
k = 36

[[personnalise.palier]]
elo_max = 2000
k = 24

[[personnalise.palier]]
elo_max = 2500
k = 18

[[personnalise.palier]]
elo_max = 999999
k = 12

